<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QRally Light - Fixed Layout</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        html, body {
            height: 100%;
            width: 100%;
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden; /* Prevents vertical scrolling */
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px;
        }

        /* Responsive Panel */
        #led-panel {
            width: 100%;
            flex: 1; /* Takes available space without pushing controls off-screen */
            min-height: 200px;
            border-radius: 16px;
            background-color: #1a1a1a;
            border: 3px solid #333333;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
            transition: background-color 0.2s ease, box-shadow 0.2s ease;
        }

        #led-panel.state-on { background-color: #00ff66; box-shadow: 0 0 35px #00ff66; border-color: #ffffff; }
        #led-panel.state-off { background-color: #0d0d0d; box-shadow: none; border-color: #222222; }
        #led-panel.state-flash { background-color: #ff0033; box-shadow: 0 0 45px #ff0033; border-color: #ffffff; }

        #panel-text {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #000000;
            text-transform: uppercase;
            text-align: center;
        }
        #led-panel.state-off #panel-text { color: #333333; }

        /* Telemetry Card - Fixed Height */
        .telemetry-card {
            background: #111111;
            border: 1px solid #222222;
            border-radius: 10px;
            padding: 10px 12px;
            font-family: monospace;
            font-size: 0.85rem;
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        .telemetry-row { display: flex; justify-content: space-between; margin-bottom: 3px; }
        .telemetry-row:last-child { margin-bottom: 0; }
        .label { color: #888888; }
        .value { color: #ffff00; font-weight: bold; }

        /* High-Visibility Button Bar */
        .btn-group { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 8px; 
            flex-shrink: 0;
        }

        button, label.btn {
            background-color: #222222;
            color: #ffffff;
            border: 2px solid #555555;
            padding: 14px 5px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 900;
            cursor: pointer;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        button.primary, label.btn {
            background-color: #1a3a5c;
            border-color: #0088ff;
            color: #ffffff;
        }

        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <div id="led-panel" class="state-off">
        <div id="panel-text">NO GPX LOADED</div>
    </div>

    <div class="telemetry-card">
        <div class="telemetry-row"><span class="label">GPX Route:</span><span class="value" id="gpx-info">None</span></div>
        <div class="telemetry-row"><span class="label">GPS Status:</span><span class="value" id="gps-status">Awaiting Start</span></div>
        <div class="telemetry-row"><span class="label">Cross-Track Dist:</span><span class="value" id="dist-val">-- m</span></div>
        <div class="telemetry-row"><span class="label">Speed:</span><span class="value" id="speed-val">0 mph</span></div>
    </div>

    <div class="btn-group">
        <label class="btn" for="gpx-input">📁 LOAD GPX</label>
        <input type="file" id="gpx-input" accept=".gpx" onchange="loadGPX(event)">
        <button id="btn-toggle" class="primary" onclick="toggleGPS()">▶ START</button>
    </div>

    <script>
        let testRoute = [];
        const CORRIDOR_RADIUS_METERS = 20.0;
        let watchId = null;
        let isOnRoute = false;
        let wakeLock = null;

        const ledPanel = document.getElementById('led-panel');
        const panelText = document.getElementById('panel-text');
        const gpsStatus = document.getElementById('gps-status');
        const distVal = document.getElementById('dist-val');
        const speedVal = document.getElementById('speed-val');
        const gpxInfo = document.getElementById('gpx-info');

        function loadGPX(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const xmlText = e.target.result;
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, "text/xml");
                
                testRoute = [];
                const points = xmlDoc.querySelectorAll("trkpt, rtept");
                
                points.forEach(pt => {
                    testRoute.push({
                        lat: parseFloat(pt.getAttribute("lat")),
                        lon: parseFloat(pt.getAttribute("lon"))
                    });
                });

                if (testRoute.length > 0) {
                    gpxInfo.innerText = `${testRoute.length} pts loaded`;
                    gpxInfo.style.color = "#00ff66";
                    setPanelState('off', 'READY');
                } else {
                    alert("No valid points found in GPX file.");
                }
            };
            reader.readAsText(file);
        }

        async function toggleGPS() {
            const btn = document.getElementById('btn-toggle');
            if (watchId === null) {
                if (testRoute.length === 0) {
                    alert("Please load a GPX route first!");
                    return;
                }

                if ('wakeLock' in navigator) {
                    try { wakeLock = await navigator.wakeLock.request('screen'); } catch(e){}
                }

                if ("geolocation" in navigator) {
                    watchId = navigator.geolocation.watchPosition(
                        processPosition, handleError, 
                        { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
                    );
                    gpsStatus.innerText = "Active";
                    gpsStatus.style.color = "#00ff66";
                    btn.innerText = "⏹ STOP";
                    btn.style.backgroundColor = "#990000";
                    btn.style.borderColor = "#ff3333";
                }
            } else {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
                if (wakeLock) { wakeLock.release(); wakeLock = null; }
                gpsStatus.innerText = "Stopped";
                gpsStatus.style.color = "#ff3333";
                btn.innerText = "▶ START";
                btn.className = "primary";
                btn.style.backgroundColor = "#1a3a5c";
                btn.style.borderColor = "#0088ff";
                setPanelState('off', 'STANDBY');
            }
        }

        function processPosition(pos) {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            const speed = pos.coords.speed ? Math.round(pos.coords.speed * 2.23694) : 0;
            speedVal.innerText = speed + " mph";

            let minDist = Infinity;
            for (let i = 0; i < testRoute.length - 1; i++) {
                let d = distanceToSegment(lat, lon, testRoute[i].lat, testRoute[i].lon, testRoute[i+1].lat, testRoute[i+1].lon);
                if (d < minDist) minDist = d;
            }

            distVal.innerText = minDist.toFixed(1) + " m";

            if (minDist <= CORRIDOR_RADIUS_METERS) {
                setPanelState('on', 'ON ROUTE');
            } else {
                if (isOnRoute) {
                    triggerOffRouteSequence();
                } else {
                    setPanelState('off', 'OFF ROUTE');
                }
            }
        }

        function setPanelState(state, text) {
            ledPanel.className = 'state-' + state;
            panelText.innerText = text;
            isOnRoute = (state === 'on');
        }

        function triggerOffRouteSequence() {
            isOnRoute = false;
            ledPanel.className = 'state-flash';
            panelText.innerText = 'DEV WARNING!';
            setTimeout(() => { setPanelState('off', 'OFF ROUTE'); }, 1200);
        }

        function distanceToSegment(pLat, pLon, aLat, aLon, bLat, bLon) {
            const x = pLon, y = pLat, x1 = aLon, y1 = aLat, x2 = bLon, y2 = bLat;
            const A = x - x1, B = y - y1, C = x2 - x1, D = y2 - y1;
            const dot = A * C + B * D;
            const len_sq = C * C + D * D;
            let param = -1;
            if (len_sq !== 0) param = dot / len_sq;

            let xx, yy;
            if (param < 0) { xx = x1; yy = y1; }
            else if (param > 1) { xx = x2; yy = y2; }
            else { xx = x1 + param * C; yy = y1 + param * D; }

            return haversineDistance(pLat, pLon, yy, xx);
        }

        function haversineDistance(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function handleError(err) {
            gpsStatus.innerText = "Error: " + err.message;
            gpsStatus.style.color = "#ff0033";
        }
    </script>
</body>
</html>
